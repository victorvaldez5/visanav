# uv workspace root for VisaNav's Python services.
#
# One lockfile (uv.lock) pins every Python dependency across the api, the scraper
# and the data tooling, so they can never drift onto different versions of a
# shared package. Each member still declares only its own dependencies, and the
# deploy images install just their member (`uv sync --package api`), so the API
# image never ships Scrapy/boto3 and the scraper never ships Django.
#
#   uv sync --all-packages      # dev: one .venv at the repo root with everything
#   just                        # list the common tasks (see justfile)

[tool.uv.workspace]
members = ["api", "scrapers/uscis_scraper", "data/scripts"]

[dependency-groups]
# Repo-wide tooling. ruff is pinned to a minor line so lint is deterministic:
# a newer minor can add rules and turn CI red on unchanged code.
dev = ["ruff>=0.16,<0.17"]

[tool.ruff]
target-version = "py313"
# Generated migrations and crawl output aren't hand-maintained code.
extend-exclude = ["**/migrations/**", "scrapers/uscis_scraper/output/**"]

[tool.ruff.lint]
# Pin the enforced rule set explicitly so lints don't drift when ruff is
# upgraded: a newer ruff can broaden its *default* select and turn CI red on
# unchanged code. This mirrors ruff's classic default (pyflakes + core
# pycodestyle); widen it deliberately, not incidentally.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Django settings compose with `from .base import *`; the star import (F403) and
# the names it pulls in (F405) are the idiom here, not a mistake.
"api/api_project/dev.py" = ["F403", "F405"]
"api/api_project/prod.py" = ["F403", "F405"]
