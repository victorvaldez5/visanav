name: Feature request
description: Suggest an improvement or new capability
title: "[feature] <short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. If this is about adding immigration data for a
        country, use the **New or updated country data** template instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need or the person it helps, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, if any.
    validations:
      required: false
