name: Feature request
description: Suggest an improvement or new capability
title: "[feature] <short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. To suggest a website, report wrong information, or
        volunteer as a reviewer, use **Improve the data** instead.

        Proposing a new scraper? Describe the source and what to extract below,
        and see the [scraper guide](https://github.com/victorvaldez5/visanav/blob/main/scrapers/README.md).
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need or the person it helps, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, if any.
    validations:
      required: false
