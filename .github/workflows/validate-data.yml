name: validate-data

# Gates the *format* of contributed data on every PR that touches data/.
# Human maintainers still review the substance.

on:
  pull_request:
    paths:
      - "data/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/validate-data.yml"
  push:
    branches: [main, develop]
    paths:
      - "data/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/validate-data.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # Python 3.13 comes from the root .python-version; uv installs it.
          enable-cache: true

      - name: Install data tooling
        run: uv sync --locked --package visanav-data --no-dev

      - name: Validate all country data
        run: uv run --no-sync python data/scripts/validate.py
