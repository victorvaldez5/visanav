name: scraper-ci

# Runs the scraper's unit tests on every PR (and main/develop push) that
# touches the scraper.

on:
  pull_request:
    paths:
      - "scrapers/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/scraper-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "scrapers/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/scraper-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # Python 3.13 comes from the root .python-version; uv installs it.
          enable-cache: true

      - name: Lint (ruff)
        run: |
          uv sync --locked --only-group dev
          uv run --no-sync ruff check scrapers

      - name: Install scraper dependencies
        run: uv sync --locked --package uscis-scraper

      - name: Run scraper tests
        working-directory: scrapers/uscis_scraper
        run: uv run --no-sync pytest
