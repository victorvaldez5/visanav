name: api-ci

# Lints and tests the Django API on every PR (and main/develop push) that
# touches it. Tests run against a real Postgres, with the schema built from the
# models (pytest --no-migrations, configured in api/pyproject.toml).

on:
  pull_request:
    paths:
      - "api/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/api-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "api/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/api-ci.yml"

jobs:
  lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector-enabled image so the `vector` extension is available. Tests run
        # --no-migrations (schema from models), so the extension is seeded into
        # template1 below before the test DB is created (api/conftest.py mirrors
        # this for local runs).
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: visanav
          POSTGRES_PASSWORD: pswd
          POSTGRES_DB: visanav_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visanav"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: api_project.dev
      DJANGO_SECRET_KEY: ci-secret-key
      POSTGRES_DB: visanav_test
      POSTGRES_USER: visanav
      POSTGRES_PASSWORD: pswd
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # Python 3.13 comes from the root .python-version; uv installs it.
          enable-cache: true

      # ruff lives in the workspace root's dev group, which a per-package sync
      # doesn't include, so lint from its own (tiny) sync first.
      - name: Lint (ruff)
        run: |
          uv sync --locked --only-group dev
          uv run --no-sync ruff check api

      # Only the api member's deps (+ its pytest dev group), exactly as the
      # image installs them: a missing dependency can't hide behind the
      # scraper's packages.
      - name: Install dependencies
        run: uv sync --locked --package api

      - name: Run tests (with coverage)
        working-directory: api
        run: uv run --no-sync pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: api-coverage
          path: api/coverage.xml
          if-no-files-found: ignore
