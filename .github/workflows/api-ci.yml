name: api-ci

# Lints and tests the Django API on every PR (and main/develop push) that
# touches it. Tests run against a real Postgres, with the schema built from the
# models (pytest --no-migrations, configured in api/pyproject.toml).

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"

jobs:
  lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector-enabled image so the `vector` extension is available. Tests run
        # --no-migrations (schema from models), so the extension is seeded into
        # template1 below before the test DB is created (api/conftest.py mirrors
        # this for local runs).
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: visanav
          POSTGRES_PASSWORD: pswd
          POSTGRES_DB: visanav_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visanav"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: api_project.dev
      DJANGO_SECRET_KEY: ci-secret-key
      POSTGRES_DB: visanav_test
      POSTGRES_USER: visanav
      POSTGRES_PASSWORD: pswd
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        working-directory: api
        run: poetry install --no-root --with dev

      - name: Lint (ruff)
        working-directory: api
        run: poetry run ruff check .

      - name: Run tests (with coverage)
        working-directory: api
        run: poetry run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: api-coverage
          path: api/coverage.xml
          if-no-files-found: ignore
