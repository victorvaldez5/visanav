name: scrape

# Scheduled USCIS crawl → Cloudflare R2. Runs weekly (forms + INA + Policy
# Manual all change slowly) and on manual dispatch. The crawl is incremental:
# unchanged pages are skipped via the content-hash manifest in R2, so re-runs
# only write what actually changed.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # Python 3.13 comes from the root .python-version; uv installs it.
          enable-cache: true

      - name: Install scraper dependencies
        run: uv sync --locked --package uscis-scraper --no-dev

      - name: Crawl USCIS → R2
        working-directory: scrapers/uscis_scraper
        env:
          LOCAL_TEST: "false"
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION_NAME: auto
        run: uv run --no-sync scrapy crawl uscis
