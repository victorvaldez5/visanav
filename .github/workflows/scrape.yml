name: scrape

# Scheduled USCIS crawl → Cloudflare R2. Runs weekly (forms + INA + Policy
# Manual all change slowly) and on manual dispatch. The crawl is incremental:
# unchanged pages are skipped via the content-hash manifest in R2, so re-runs
# only write what actually changed.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install scraper dependencies
        run: pip install -r scrapers/uscis_scraper/requirements.txt

      - name: Crawl USCIS → R2
        working-directory: scrapers/uscis_scraper
        env:
          LOCAL_TEST: "false"
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION_NAME: auto
        run: scrapy crawl uscis
