name: scrape

# Manual crawl of one source → Cloudflare R2. The weekly schedules now run on
# Railway (the `visanav-scraper*` cron services, .railway/railway.ts); this
# workflow is only a manual fallback, kept off the schedule because the repo is
# private and a full USCIS crawl costs ~170 Actions minutes. It writes to whatever bucket the
# R2_BUCKET / AWS_* repo secrets point at, which may not be the production bucket
# Railway uses, so check them before dispatching it.

on:
  workflow_dispatch:
    inputs:
      source:
        description: Which source to crawl
        type: choice
        default: uscis
        options: [uscis, ecfr, federal-register]

jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # Python 3.13 comes from the root .python-version; uv installs it.
          enable-cache: true

      - name: Install scraper dependencies
        run: uv sync --locked --package uscis-scraper --no-dev

      - name: Crawl ${{ inputs.source }} → R2
        working-directory: scrapers/uscis_scraper
        env:
          LOCAL_TEST: "false"
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION_NAME: auto
        run: uv run --no-sync scrapy crawl "${{ inputs.source }}"
