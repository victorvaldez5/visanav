services:
  uscis_scraper:
    profiles: [ "scraper" ]
    build:
      context: .
      dockerfile: ./scrapers/uscis_scraper/Dockerfile
      target: ${BUILD_TARGET:-development}
    #    image: ${ECR_REPOSITORY}:${TAG:-latest}
    hostname: uscis_scraper
    volumes:
      - ./scrapers/uscis_scraper:/app
    env_file:
      - config/.env
    working_dir: "/app"
    ports:
      - "9000:9000"
    environment:
      - PYTHONUNBUFFERED=1
    command: [ "scrapy", "crawl", "uscis" ]

  frontend:
    hostname: frontend
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    env_file:
      - config/.env

    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    depends_on:
      - api

  api:
    hostname: api
    build:
      context: .
      dockerfile: ./api/Dockerfile
      target: development

    # Run under ASGI (uvicorn) so Server-Sent Events streaming works in dev.
    # `runserver` is WSGI and buffers streaming responses.
    # Exec form, not `bash -lc`: a login shell resets PATH and drops the image's
    # /opt/venv/bin, so `python` would lose every installed package.
    command: ["python", "-m", "uvicorn", "api_project.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - config/.env
    volumes:
      - ./api:/app
      # Curated resource corpus for `load_resources` (the ./api:/app mount would
      # otherwise shadow the image's /app/data).
      - ./data:/app/data
    environment:
      - PYTHONBUFFERED=1
      - PYTHONPATH=/app
      # Reach Postgres by its compose service name. Set here (not in
      # config/.env) so the same env file also works for commands run on the
      # host, where the db is on localhost:5432.
      - POSTGRES_HOST=db
      # The ./data:/app/data mount above puts the corpus here, but the default
      # (BASE_DIR.parent/data/countries) resolves to /data in the container
      # because api code lives at /app, not /app/api. Point ingest at the mount.
      - KNOWLEDGE_DATA_DIR=/app/data/countries
    ports:
      - "8000:8000"
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    # pgvector-enabled Postgres (provides the `vector` extension for RAG retrieval).
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    hostname: db
    # Credentials come from config/.env (the single env file all services read).
    # Do NOT add an `environment:` override here — it takes precedence over
    # env_file, so the volume would initialize under the wrong role, and Postgres
    # only applies POSTGRES_* on first init (renaming later silently mismatches).
    env_file:
      - config/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
