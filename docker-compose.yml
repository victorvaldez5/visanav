services:
  uscis_scraper:
    profiles: [ "scraper" ]
    build:
      context: .
      dockerfile: ./scrapers/uscis_scraper/Dockerfile
      target: ${BUILD_TARGET:-development}
    #    image: ${ECR_REPOSITORY}:${TAG:-latest}
    hostname: uscis_scraper
    volumes:
      - ./scrapers/uscis_scraper:/app
    env_file:
      - config/.env
    working_dir: "/app"
    ports:
      - "9000:9000"
    environment:
      - PYTHONUNBUFFERED=1
    command: [ "scrapy", "crawl", "uscis" ]

  frontend:
    hostname: frontend
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    env_file:
      - config/.env

    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    depends_on:
      - api

  api:
    hostname: api
    build:
      context: .
      dockerfile: ./api/Dockerfile
      target: development

    # Run under ASGI (uvicorn) so Server-Sent Events streaming works in dev.
    # `runserver` is WSGI and buffers streaming responses.
    command: bash -lc "python -m uvicorn api_project.asgi:application --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - config/.env
    volumes:
      - ./api:/app
    environment:
      - PYTHONBUFFERED=1
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    hostname: db
    # Credentials come from config/.env (the single env file all services read).
    # Do NOT add an `environment:` override here — it takes precedence over
    # env_file, so the volume would initialize under the wrong role, and Postgres
    # only applies POSTGRES_* on first init (renaming later silently mismatches).
    env_file:
      - config/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
