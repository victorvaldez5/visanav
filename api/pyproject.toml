[project]
name = "api"
version = "0.1.0"
description = "an api server"
authors = [{ name = "Victor Valdez", email = "vv.digitalfuturesllc@gmail.com" }]
# Django 6.1 requires Python >=3.12; the deploy/CI runtime is 3.13 (see the root
# .python-version). voyageai has no 3.14 wheel yet, hence the upper bound.
requires-python = ">=3.13,<3.14"
dependencies = [
    # Vector store: pgvector provides the Django VectorField + CREATE EXTENSION op;
    # voyageai generates the embeddings (pgvector does not embed). Both are
    # pure-Python, so no Dockerfile/system-dep changes are needed.
    "pgvector>=0.5,<0.6",
    "voyageai>=0.5,<0.6",
    # Pinned to a minor line so a fresh resolve can't drift onto an untested
    # release (an unbounded `>=` once let Django jump 5.2 -> 6.1 in a prod build).
    # Bump deliberately; uv.lock still pins the exact patch.
    "django>=6.1,<6.2",
    "django-cors-headers>=4.9,<5",
    "djangorestframework>=3.18,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "gunicorn>=26.2,<27",
    "psycopg2-binary>=2.9.10,<3",
    "python-dotenv>=1.1,<2",
    "python-jose>=3.5,<4",
    "whitenoise>=6.12,<7",
    "uvicorn[standard]>=0.53,<0.54",
    "mailtrap>=2.1,<3",
    # The slim package with only the providers we support (anthropic + openai);
    # the full `pydantic-ai` bundles every provider, including Bedrock (-> boto3).
    # The [anthropic] extra pulls a compatible anthropic SDK, so we don't pin it
    # ourselves (a hand pin here is what drifted out of sync with pydantic-ai before).
    "pydantic-ai-slim[anthropic,openai]>=2.46,<3",
    "django-phonenumber-field[phonenumberslite]>=8.1,<9",
    "pycountry>=26.2.16,<27",
    "django-countries>=9.1,<10",
    "django-filter>=26.1,<27",
    "beautifulsoup4>=4.13.5,<5",
    "pdfplumber>=0.11.7,<0.12",
    # Reads curated resource YAML (data/countries/<cc>/resources/) in load_resources.
    "pyyaml>=6.0,<7",
    # Used directly by core/encryption.py to encrypt conversation content at rest.
    # Also pulled transitively (pdfminer.six), but declared here so it survives any
    # future trimming of the PDF/scraper deps.
    "cryptography>=42.0,<51",
]

[dependency-groups]
dev = ["pytest>=9.1,<10", "pytest-django>=4.9", "pytest-cov>=6.0", "pytest-asyncio>=0.24"]
# Scheduled ingestion reads the scrapers' feeds from R2 (knowledge/feed_store.py).
# Installed only in the ingest image (api/ingest.Dockerfile), never the web image.
ingest = ["boto3>=1.43,<2"]

[tool.uv]
# A Django project run from this directory, not an installable package.
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "api_project.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
# Async views (the SSE chat endpoint) are tested with pytest-asyncio. Strict mode
# only touches tests marked @pytest.mark.asyncio, leaving the existing sync and
# asyncio.run(...) tests untouched.
asyncio_mode = "strict"
# Build the test schema straight from the models. The data migrations
# pre-populate reference tables (all countries/subdivisions via pycountry, plus
# org fixtures), which unit tests shouldn't fight; this also keeps the run fast.
# Coverage is opt-in (`pytest --cov`, run by CI) rather than in addopts, so the
# default local run and `pytest -k ...` stay fast and unadorned.
addopts = "--no-migrations"

[tool.coverage.run]
# `pytest --cov` reads this (source + omit) so the flag needs no arguments.
# Percentage reflects hand-written app code, not generated/boilerplate files.
source = ["."]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "*/test_*.py",
    "manage.py",
    "*/apps.py",
    "*/wsgi.py",
    "*/asgi.py",
    "api_project/settings.py",
    "api_project/base.py",
    "api_project/dev.py",
    "api_project/prod.py",
    "conftest.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

