    de deportación?
  good_response: >-
    resource_lookup para Arizona. Lista solo orgs devueltas; si ninguna coincide
    con el servicio, puede ampliar y debe decirlo. Sin contactos inventados.

- id: tx-asylum-where-es
  lang: es
  category: resource-referral
  expect_tool: resource_lookup
